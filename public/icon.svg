<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F1A2C" />
      <stop offset="100%" stop-color="#070D18" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE79A" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997D21" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer Sacred Geometry Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="172" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="162" fill="none" stroke="#059669" stroke-width="1" stroke-opacity="0.3" />

  <!-- Central Crescent & Star -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Crescent Moon -->
    <path d="M 16 -88 A 96 96 0 1 0 16 88 A 76 76 0 1 1 16 -88 Z" fill="url(#goldGrad)" />
    
    <!-- 8-Point Rub el Hizb Star -->
    <g transform="translate(24, 0)">
      <rect x="-24" y="-24" width="48" height="48" fill="url(#goldGrad)" rx="3" />
      <rect x="-24" y="-24" width="48" height="48" fill="url(#goldGrad)" rx="3" transform="rotate(45)" />
      <circle cx="0" cy="0" r="8" fill="#070D18" />
    </g>
  </g>
</svg>
